    :root {
      --bg-light: #f3b06f;
      --bg-peach: #f8c38b;
      --bg-terracotta: #d97849;
      --bg-terracotta-light: #e99a62;
      --bg-terracotta-dark: #cb6945;
      --orange-dark: #a84d1e;
      --orange-vibrant: #f28d2a;
      --ink: #221b18;
      --ink-dark: #17120f;
      --ink-alt: #202020;
      --cream: #fff6e8;
      --cream-soft: #fff3e0;
      --cream-translucent: rgba(255, 248, 238, 0.38);
      --white: #ffffff;
      --line: rgba(255,255,255,.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

   
    html {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    ::selection { background: transparent; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .fondo-gradiente {
      background:
        radial-gradient(circle at 78% 14%, rgba(255,255,255,.22), transparent 24%),
        radial-gradient(circle at 18% 14%, rgba(255,255,255,.08), transparent 22%),
        linear-gradient(
          180deg,
          var(--bg-peach) 0%,
          var(--bg-light) 20%,
          var(--bg-terracotta-light) 52%,
          var(--bg-terracotta) 78%,
          var(--bg-terracotta-dark) 100%
        );
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .shell {
      width: min(100%, 1440px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 46px 26px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      color: rgba(255,255,255,.92);
      font-size: 14px;
    }

    .brand {
      white-space: nowrap;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -.01em;
      font-size: clamp(20px, 1.7vw, 30px);
      line-height: 1;
    }

    .status {
      --neon: #39ff14;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--neon);
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(70,24,6,.45), 0 0 10px rgba(57,255,20,.45);
      white-space: nowrap;
    }

   
    .shell { position: relative; }
    .pagefoot {
      position: absolute;
      z-index: 2;
      left: 46px;
      bottom: 26px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 0 4px rgba(57,255,20,.16), 0 0 12px rgba(57,255,20,.9);
      flex: 0 0 auto;
    }

  
    .hero {
      position: absolute;
      inset: 0;
      padding: 88px 46px;
      display: grid;
    }

    .hero-inner {
      width: min(100%, 1220px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
    
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
    }

    .below { align-self: start; display: grid; justify-items: center; }


    .readout {
      position: relative;
      width: 100%;
      display: grid;
      justify-items: center;
      align-items: center;
    }

    .readout-spacer { display: none; }

    .months {
      position: absolute;
      left: var(--m-left, 100%);
      top: var(--m-top, 50%);
      transform: translateY(-50%);
      display: grid;
      gap: 6px;
    }

    .year-picker {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #fff;
      font: 800 14px/1 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .year-step {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font: 700 18px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    .year-step:hover:not(:disabled) { background: rgba(255,255,255,.14); }
    .year-step:disabled { color: rgba(255,246,232,.3); cursor: default; }
    .year-step:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

    .year-value { min-width: 3.1em; text-align: center; }

    .months-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 2px;
    }

    .month {
      display: block;
      width: 100%;
      padding: 4px 14px 4px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,246,232,.72);
      font: 600 14px/1.1 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: left;
      cursor: pointer;
      transition: background-color .15s, color .15s;
    }

    .month:hover:not(:disabled):not([aria-pressed="true"]) { color: #fff; background: rgba(255,255,255,.12); }

    .month[aria-pressed="true"] {
      background: #fff;
      color: var(--orange-dark);
      font-weight: 800;
    }

    .month:disabled {
      color: rgba(255,246,232,.34);
      cursor: default;
    }

    .month:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .metric {
      margin: 0;
      display: inline-block;
      white-space: nowrap;
      color: var(--white);
      font-size: calc(clamp(118px, 18vw, 318px) * var(--fit, 1));
      font-weight: 900;
      line-height: .82;
      letter-spacing: -.08em;
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1, "kern" 1;
      text-align: center;
      text-shadow: 0 16px 38px rgba(102,41,13,.10);
    }

    .metric-prefix,
    .last-zero {
      font: inherit;
      color: inherit;
      line-height: inherit;
      letter-spacing: inherit;
    }

    .last-zero {
      --zero-top: 0.054em;
      --zero-center: calc(50% + .04em);
      --seat-drop: .035em;
      --seat-y: calc(var(--zero-top) + var(--seat-drop));
      position: relative;
      display: inline-block;
      vertical-align: baseline;
    }

    .last-zero::after {
      content: "";
      position: absolute;
      left: var(--zero-center);
      top: var(--seat-y);
      width: var(--seat-w, .42em);
      height: .07em;
      transform: translate(-50%, -45%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(87,31,13,.38) 0%, rgba(87,31,13,.16) 45%, rgba(87,31,13,0) 72%);
      filter: blur(3px);
      z-index: 3;
      pointer-events: none;
    }


    .cow {
      --lean: 0px;
      position: absolute;
      z-index: 4;
      left: var(--zero-center);
      top: var(--seat-y);
      width: .7em;
      transform: translate(-50%, -81.5%);
      transform-origin: 50% 81.5%;
      pointer-events: none;
      will-change: transform;
    }

    .cow img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .subtitle {
      margin-top: 18px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--cream);
      font-size: clamp(22px, 2.35vw, 42px);
      letter-spacing: -.025em;
      text-align: center;
    }

    .subtitle strong {
      color: #fff;
      font-weight: 850;
    }

    .subtitle span {
      color: rgba(255,246,232,.88);
      font-weight: 500;
    }

    .compare {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 36px;
      font-size: clamp(14px, 1.15vw, 18px);
    }

    .delta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(23,18,15,.46);
      white-space: nowrap;
    }

    .delta.is-up   { --trend: #39ff14; }
    .delta.is-down { --trend: #ff4d4d; }
    .delta.is-up .delta-value, .delta.is-up .delta-abs,
    .delta.is-down .delta-value, .delta.is-down .delta-abs { color: var(--trend); }

    .delta-value {
      color: #fff;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .delta-abs {
      color: rgba(255,246,232,.82);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .delta-label { color: rgba(255,246,232,.82); }

    .compare-item {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .compare-tag {
      color: rgba(255,246,232,.82);
      font-weight: 500;
      font-size: .88em;
    }
    .compare-tag b { color: #fff; font-weight: 800; }


    .metric-wrap {
      position: relative;
      --ink-x: 0px;
    }

    .metric-month {
      position: absolute;
      left: calc(50% + var(--ink-x));
      bottom: 100%;
      transform: translate(-50%, calc(-1 * var(--lift, 0px)));
      margin: 0 0 clamp(14px, 2.6vw, 44px);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      color: #fff;
      font-size: clamp(11px, .8vw, 14px);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      line-height: 1;
    }


    @media (max-width: 700px) {
      .metric-month { margin-bottom: 12px; letter-spacing: .12em; }
    }

    .baseline-probe {
      display: inline-block;
      width: 0;
      height: 0;
    }

    @media (max-width: 900px) {
      .shell {
        padding: 18px 18px 18px;
      }

      .topbar {
        font-size: 12px;
      }

      .hero {
        padding: 72px 18px;
      }


      .metric {
        font-size: calc(clamp(80px, 20vw, 176px) * var(--fit, 1));
        letter-spacing: -.068em;
      }

      .subtitle {
        margin-top: 14px;
        font-size: clamp(18px, 4vw, 29px);
      }

    }

    @media (max-width: 900px) {
      .readout {
        position: relative;
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
      }
      .months {
        transform: none;
        top: auto;
        justify-self: stretch;
        grid-auto-flow: column;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 6px;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        margin-block: 0 calc(16vw + 34px);
      }

      .months-list {
        grid-auto-flow: column;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px;
      }
      .months-list::-webkit-scrollbar { display: none; }
      .topbar { gap: 8px; font-size: 11.5px; }
      .brand { font-size: 18px; }
      .compare { flex-direction: column; align-items: center; gap: 8px; }
      .status { gap: 7px; font-size: 12px; }
      .pagefoot { left: 18px; bottom: 18px; }
      .month { padding: 7px 11px; }

  <script>
    (() => {
      const DATA = Object.create(null);
      const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                      'septiembre','octubre','noviembre','diciembre'];

      let year = 0;
      let month = 0;

      const $ = (id) => document.getElementById(id);
      const list = $('months-list'), prefix = $('metric-prefix'), metric = $('metric'), lastDigit = $('metric-last');
      const wrap = $('metric-wrap'), monthLabel = $('metric-month'), probe = $('baseline-probe');
      const hero = document.querySelector('.hero'), inner = document.querySelector('.hero-inner');
      const below = document.querySelector('.below');
      const readout = document.querySelector('.readout'), monthsNav = document.querySelector('.months');
      const narrow = matchMedia('(max-width: 900px)');
      const yearValue = $('year-value'), prev = $('year-prev'), next = $('year-next');
      const fmt = new Intl.NumberFormat('es-AR');
      const pct = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const value = (y, m) => (DATA[y] ? DATA[y][m] : null) ?? null;
      const hasData = (y, m) => value(y, m) != null;
      const lastMonthWithData = (y) => { for (let m = 11; m >= 0; m--) if (hasData(y, m)) return m; return -1; };

      const buttons = MONTHS.map((name, i) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'month';
        btn.textContent = name.slice(0, 3).replace(/^./, c => c.toUpperCase());
        btn.addEventListener('click', () => select(year, i));
        li.appendChild(btn);
        list.appendChild(li);
        return btn;
      });

      prev.addEventListener('click', () => changeYear(-1));
      next.addEventListener('click', () => changeYear(1));

      function changeYear(step) {
        const y = year + step;
        if (!DATA[y]) return;
        select(y, hasData(y, month) ? month : lastMonthWithData(y));
      }

      list.addEventListener('keydown', (e) => {
        const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
        if (!step) return;
        e.preventDefault();
        let i = month + step;
        while (i >= 0 && i < 12 && !hasData(year, i)) i += step;
        if (i >= 0 && i < 12) { select(year, i); buttons[i].focus(); }
      });

      function delta(el, current, base, label) {
        if (base == null) {
          el.className = 'delta';
          el.innerHTML = `<span class="delta-value">—</span><span class="delta-label">sin dato para ${label}</span>`;
          return;
        }
        const diff = current - base;
        const p = (diff / base) * 100;
        const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '■';
        const sign = diff > 0 ? '+' : diff < 0 ? '−' : '';
        el.className = 'delta' + (diff > 0 ? ' is-up' : diff < 0 ? ' is-down' : '');
        el.innerHTML =
          `<span class="delta-value">${arrow} ${pct.format(Math.abs(p))}%</span>` +
          `<span class="delta-abs">(${sign}${fmt.format(Math.abs(diff))} b/d)</span>` +
          `<span class="delta-label">vs. ${label}</span>`;
      }

      function select(y, m, animate = true) {
        if (!hasData(y, m)) return;
        const changed = y !== year || m !== month;
        year = y; month = m;
        const v = value(y, m);
        const text = fmt.format(v);

        yearValue.textContent = y;
        monthLabel.textContent = MONTHS[m].replace(/^./, c => c.toUpperCase()) + ' ' + y;
        prev.disabled = !DATA[y - 1];
        next.disabled = !DATA[y + 1];
        buttons.forEach((b, j) => {
          b.disabled = !hasData(y, j);
          b.title = b.disabled ? 'Sin datos todavía' : '';
          b.setAttribute('aria-label', `${MONTHS[j]} ${y}`);
          b.setAttribute('aria-pressed', String(j === m));
        });
        buttons[m].scrollIntoView({ block: 'nearest', inline: 'center' });
        metric.setAttribute('aria-label', `${text} barriles por día en ${MONTHS[m]} de ${y}`);

        const pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y;
        delta($('delta-month'), v, value(py, pm), `${MONTHS[pm]} ${py}`);
        delta($('delta-year'), v, value(y - 1, m), `${MONTHS[m]} ${y - 1}`);

        const apply = () => { prefix.textContent = text.slice(0, -1); lastDigit.textContent = text.slice(-1); centerInk(); };
        if (!animate || !changed || reduced) return apply();
        prefix.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-.04em)' }],
                       { duration: 120, easing: 'ease-in' }).onfinish = () => {
          apply();
          prefix.animate([{ opacity: 0, transform: 'translateY(.04em)' }, { opacity: 1 }],
                         { duration: 180, easing: 'ease-out' });
        };
      }

      const ctx = document.createElement('canvas').getContext('2d');
      function measureInk() {
        const cs = getComputedStyle(metric);
        ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const ls = parseFloat(cs.letterSpacing) || 0;
        let x = 0, left = Infinity, right = -Infinity, top = 0;
        for (const ch of prefix.textContent + lastDigit.textContent) {
          const m = ctx.measureText(ch);
          left = Math.min(left, x - m.actualBoundingBoxLeft);

      addEventListener('blur', alFrente);
      document.documentElement.addEventListener('mouseleave', alFrente);
      cow.addEventListener('vaca:mira', (e) => { destX = e.detail.x * .8; destY = e.detail.y * .7; });

      const resorte = (k, freno) => ({ x: 0, v: 0, k, freno });
      const giro = resorte(.075, .80), cabeceo = resorte(.075, .80), cuerpo = resorte(.04, .86);
      function paso(s, destino, f) {
        s.v += (destino - s.x) * s.k * f;
        s.v *= Math.pow(s.freno, f);
        s.x += s.v * f;
      }

      let antes = 0, t = 0;
      function cuadro(ahora) {
        const f = Math.min(ahora - antes, 50) / 16.67;
        antes = ahora;
        t += f * .03;
        paso(giro, destX, f);
        paso(cabeceo, destY, f);
        paso(cuerpo, destX, f);

        dibujar(giro.x * (giro.x < 0 ? GIRO_IZQ : GIRO), cabeceo.x * CABECEO, cuerpo.x * DOBLEZ);

        const respira = Math.sin(t) * .006;
        const inclina = cuerpo.x * 1.4 + cuerpo.v * 4;
        cow.style.transform =
          `translate(-50%, -81.5%) rotate(${inclina.toFixed(3)}deg) scale(${(1 - respira).toFixed(4)}, ${(1 + respira).toFixed(4)})`;
        requestAnimationFrame(cuadro);
      }

      function arrancar() {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0, 0, 0, 0);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.uniform2f(u('tam'), W, H);
        gl.uniform1f(u('pad'), PAD);
        gl.uniform1f(u('asiento'), ASIENTO);
        gl.uniform3f(u('pivote'), ...PIVOTE);

        img.after(canvas);
        cow.classList.add('lienzo');
        dibujar(0, 0, 0);
        requestAnimationFrame((a) => { antes = a; requestAnimationFrame(cuadro); });
      }
      (img.decode ? img.decode() : Promise.resolve()).then(arrancar, arrancar);
    })();

    (() => {
      const cow = document.getElementById('cow');
      const ojos = cow ? [...cow.querySelectorAll('.ojo')] : [];
      if (ojos.length !== 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const ALCANCE = 460;
      const SALTO = 120;

      let x = 0, y = 0;
      const ix = { p: 0, v: 0 }, iy = { p: 0, v: 0 };
      const RIGIDEZ = .34, FRENO = .6;
      let andando = 0, antes = 0;

      function escribir() {
        for (const o of ojos) {
          o.style.setProperty('--mx', ix.p.toFixed(3));
          o.style.setProperty('--my', iy.p.toFixed(3));
        }
      }
      function cuadro(ahora) {
        const f = Math.min(ahora - antes, 50) / 16.67;
        antes = ahora;
        for (const [s, d] of [[ix, x], [iy, y]]) {
          s.v += (d - s.p) * RIGIDEZ * f;
          s.v *= Math.pow(FRENO, f);
          s.p += s.v * f;
        }
        escribir();
        const quieto = Math.abs(ix.p - x) + Math.abs(iy.p - y) + Math.abs(ix.v) + Math.abs(iy.v) < .002;
        andando = quieto ? 0 : requestAnimationFrame(cuadro);
      }
      function pintar() {
        if (!andando) andando = requestAnimationFrame((a) => { antes = a; andando = requestAnimationFrame(cuadro); });
      }
      function centrar() { x = y = 0; pintar(); }

      function apuntar(e) {
        const a = ojos[0].getBoundingClientRect(), b = ojos[1].getBoundingClientRect();
        const cx = (a.left + a.right + b.left + b.right) / 4;
        const cy = (a.top + a.bottom + b.top + b.bottom) / 4;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const cuanto = Math.min(dist, ALCANCE) / ALCANCE;
        x = (dx / dist) * cuanto;
        y = (dy / dist) * cuanto;
        pintar();
      }

      function destino() {
        if (Math.random() < .34) return [0, 0, 900 + Math.random() * 1500];
        const ang = Math.random() * Math.PI * 2;
        const largo = .55 + Math.random() * .45;
        const queda = Math.random() < .2 ? 220 + Math.random() * 260 : 650 + Math.random() * 1700;
        return [Math.cos(ang) * largo, Math.sin(ang) * largo, queda];
      }
      let reloj = null;
      function saltar() {
        const [nx, ny, queda] = destino();
        x = nx; y = ny;
        pintar();
        cow.dispatchEvent(new CustomEvent('vaca:mira', { detail: { x, y } }));
        reloj = setTimeout(saltar, SALTO + queda);
      }

      const FINO = matchMedia('(hover: hover) and (pointer: fine)');
      let aVista = true, escuchando = false;

      function aplicar() {
        const vivo = aVista && !document.hidden;
        const fino = FINO.matches;
        cow.classList.toggle('pasea', !fino);

        const escucha = vivo && fino;
        if (escucha !== escuchando) {
          escuchando = escucha;
          if (escucha) addEventListener('pointermove', apuntar, { passive: true });
          else { removeEventListener('pointermove', apuntar); centrar(); }
        }

        const pasea = vivo && !fino;
        if (pasea && !reloj) reloj = setTimeout(saltar, 500 + Math.random() * 900);
        else if (!pasea && reloj) {
          clearTimeout(reloj); reloj = null; centrar();
          cow.dispatchEvent(new CustomEvent('vaca:mira', { detail: { x: 0, y: 0 } }));
        }
      }

      if ('IntersectionObserver' in window) {
        new IntersectionObserver((e) => { aVista = e[0].isIntersecting; aplicar(); }).observe(cow);
      }
      aplicar();
      FINO.addEventListener('change', aplicar);
      document.addEventListener('visibilitychange', aplicar);
      document.documentElement.addEventListener('mouseleave', () => { if (escuchando) centrar(); });
      addEventListener('blur', () => { if (escuchando) centrar(); });
    })();
  </script>
</body>
</html>
